name: Web Stack

on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/test_adsense_surface.py'
      - 'compose.yaml'
      - '.env.example'
      - 'docs/deployment-zneon-domain.md'
      - '.github/workflows/web-stack.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/test_adsense_surface.py'
      - 'compose.yaml'
      - '.env.example'
      - 'docs/deployment-zneon-domain.md'
      - '.github/workflows/web-stack.yml'

permissions:
  contents: read

jobs:
  web-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WEB_PORT: 18085
      GAME_SERVER_SHARED_KEY: ci-web-stack-test-key-not-for-production
      POSTGRES_PASSWORD: ci-postgres-test-password-not-for-production
      POSTGRES_EXPORTER_PASSWORD: ci-exporter-test-password-not-for-production
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build web and Go API images
        run: docker compose build web game-api
      - name: Start local full stack
        run: docker compose up -d postgres redis game-api web
      - name: Verify public web, API health, and release metadata
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18085/healthz >/dev/null && curl -fsS http://127.0.0.1:18085/api/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18085/healthz
          curl -fsS http://127.0.0.1:18085/api/healthz
          curl -fsS http://127.0.0.1:18085/client-v-0-0-1/ >/dev/null
          curl -fsS http://127.0.0.1:18085/client-v-0-0-1/manifest.json | grep -q '\"version\": \"0.0.1\"'
          curl -fsS http://127.0.0.1:18085/client-v-0-0-1/SHA256SUMS.txt >/dev/null
          curl -fsS http://127.0.0.1:18085/privacy.html >/dev/null
          curl -fsS http://127.0.0.1:18085/terms.html >/dev/null
          curl -fsS http://127.0.0.1:18085/robots.txt | grep -q 'Sitemap:'
          curl -fsS http://127.0.0.1:18085/sitemap.xml | grep -q 'https://zneon.zeaz.dev/'
      - name: Verify security headers and public API boundary
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:18085/ http://127.0.0.1:18085/client-v-0-0-1/ http://127.0.0.1:18085/client-v-0-0-1/manifest.json http://127.0.0.1:18085/privacy.html http://127.0.0.1:18085/terms.html; do
            headers="$(curl -fsS -D - -o /dev/null "$url")"
            grep -qi '^Content-Security-Policy:' <<<"$headers"
            grep -qi '^X-Frame-Options: DENY' <<<"$headers"
            grep -qi '^X-Content-Type-Options: nosniff' <<<"$headers"
            grep -qi '^Referrer-Policy:' <<<"$headers"
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18085/api/not-public)"
          test "$code" = "404"
      - name: Verify served AdSense policy boundaries
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_adsense_surface.py' -v
          home="$(curl -fsS http://127.0.0.1:18085/)"
          privacy="$(curl -fsS http://127.0.0.1:18085/privacy.html)"
          terms="$(curl -fsS http://127.0.0.1:18085/terms.html)"
          release="$(curl -fsS http://127.0.0.1:18085/client-v-0-0-1/)"
          headers="$(curl -fsS -D - -o /dev/null http://127.0.0.1:18085/)"
          grep -Fq 'ca-pub-4971034675329740' <<<"$home"
          grep -Fq 'pagead2.googlesyndication.com' <<<"$home"
          grep -Fq 'Google AdSense' <<<"$privacy"
          if grep -Fq 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' <<<"$privacy$terms$release"; then
            echo 'BLOCKED: advertising loader present on a legal or pending-release page' >&2
            exit 1
          fi
          grep -Fi 'content-security-policy:' <<<"$headers" | grep -Fq "script-src 'self' https://pagead2.googlesyndication.com"
          grep -Fi 'content-security-policy:' <<<"$headers" | grep -Fq "frame-ancestors 'none'"
      - name: Verify unpublished artifacts stay absent
        run: |
          set -euo pipefail
          for file in zneondrive-client-v-0-0-1.zip zneondrive-client-v-0-0-1.apk zneondrive-client-v-0-0-1.exe zneondrive-client-v-0-0-1.bat; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18085/client-v-0-0-1/$file")"
            test "$code" = "404"
          done
      - name: Show service status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200 web game-api postgres redis
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
