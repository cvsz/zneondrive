name: Runtime Go

on:
  push:
    branches: [main]
    paths:
      - 'services/game-api/**'
      - 'tools/postgres-restore-drill.sh'
      - 'tools/validate_postgres_exporter.py'
      - 'compose.yaml'
      - '.github/workflows/runtime-go.yml'
  pull_request:
    paths:
      - 'services/game-api/**'
      - 'tools/postgres-restore-drill.sh'
      - 'tools/validate_postgres_exporter.py'
      - 'compose.yaml'
      - '.github/workflows/runtime-go.yml'

permissions:
  contents: read

concurrency:
  group: runtime-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zneondrive_test
          POSTGRES_USER: zneondrive
          POSTGRES_PASSWORD: zneondrive-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zneondrive -d zneondrive_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: services/game-api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify module lock
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Unit tests
        run: go test ./...

      - name: PostgreSQL and Redis integration tests
        env:
          TEST_DATABASE_URL: postgres://zneondrive:zneondrive-test@127.0.0.1:5432/zneondrive_test?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -tags=integration ./...

      - name: External PostgreSQL exporter integration
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d --network host \
            -e DATA_SOURCE_URI='127.0.0.1:5432/zneondrive_test?sslmode=disable' \
            -e DATA_SOURCE_USER='zneondrive' \
            -e DATA_SOURCE_PASS='zneondrive-test' \
            -e PG_EXPORTER_COLLECTION_TIMEOUT=5s \
            quay.io/prometheuscommunity/postgres-exporter:v0.19.1)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          metrics_file=$(mktemp)
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9187/metrics >"$metrics_file"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          grep -Eq '^pg_up(\{[^}]*\})? 1$' "$metrics_file"
          grep -q '^pg_stat_database_' "$metrics_file"
          if grep -Fq 'zneondrive-test' "$metrics_file"; then
            echo 'exporter metrics leaked the database password'
            exit 1
          fi

      - name: PostgreSQL isolated backup and restore drill
        env:
          DATABASE_ADMIN_URL: postgres://zneondrive:zneondrive-test@127.0.0.1:5432/postgres?sslmode=disable
          POSTGRES_CLIENT_IMAGE: postgres:17-alpine
        run: bash ../../tools/postgres-restore-drill.sh

      - name: Upload restore drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-restore-drill-${{ github.sha }}
          path: .runtime/backup-restore-drill/
          if-no-files-found: error
          retention-days: 30

      - name: Vet
        run: go vet ./...

      - name: Build service
        run: go build -trimpath ./cmd/server