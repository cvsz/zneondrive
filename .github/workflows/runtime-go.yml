name: Runtime Go

on:
  push:
    branches: [main]
    paths:
      - 'services/game-api/**'
      - 'compose.yaml'
      - '.github/workflows/runtime-go.yml'
  pull_request:
    paths:
      - 'services/game-api/**'
      - 'compose.yaml'
      - '.github/workflows/runtime-go.yml'

permissions:
  contents: read

concurrency:
  group: runtime-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zneondrive_test
          POSTGRES_USER: zneondrive
          POSTGRES_PASSWORD: zneondrive-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zneondrive -d zneondrive_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: services/game-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify module lock
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Unit tests
        run: go test ./...

      - name: PostgreSQL and Redis integration tests
        env:
          TEST_DATABASE_URL: postgres://zneondrive:zneondrive-test@127.0.0.1:5432/zneondrive_test?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -tags=integration ./...

      - name: Vet
        run: go vet ./...

      - name: Build service
        run: go build -trimpath ./cmd/server
