name: Runtime Go

on:
  push:
    branches: [main]
    paths:
      - 'services/game-api/**'
      - 'deploy/postgres/init-monitoring.sh'
      - 'tools/postgres-restore-drill.sh'
      - 'tools/validate_postgres_exporter.py'
      - 'compose.yaml'
      - '.github/workflows/runtime-go.yml'
  pull_request:
    paths:
      - 'services/game-api/**'
      - 'deploy/postgres/init-monitoring.sh'
      - 'tools/postgres-restore-drill.sh'
      - 'tools/validate_postgres_exporter.py'
      - 'compose.yaml'
      - '.github/workflows/runtime-go.yml'

permissions:
  contents: read

concurrency:
  group: runtime-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zneondrive_test
          POSTGRES_USER: zneondrive
          POSTGRES_PASSWORD: zneondrive-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zneondrive -d zneondrive_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: services/game-api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify module lock
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Unit tests
        run: go test ./...

      - name: PostgreSQL and Redis integration tests
        env:
          TEST_DATABASE_URL: postgres://zneondrive:zneondrive-test@127.0.0.1:5432/zneondrive_test?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -tags=integration ./...

      - name: Least-privilege PostgreSQL exporter integration
        shell: bash
        run: |
          set -euo pipefail
          monitor_password='zneondrive-monitor-test'
          docker run --rm --network host \
            -e PGPASSWORD='zneondrive-test' \
            postgres:17-alpine \
            psql -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U zneondrive -d zneondrive_test \
              -v monitor_password="$monitor_password" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'zneondrive_monitor') THEN
              CREATE ROLE zneondrive_monitor LOGIN;
            END IF;
          END
          $$;
          ALTER ROLE zneondrive_monitor NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          ALTER ROLE zneondrive_monitor PASSWORD :'monitor_password';
          GRANT pg_monitor TO zneondrive_monitor;
          SQL

          role_privileges_ok=$(docker run --rm --network host \
            -e PGPASSWORD='zneondrive-test' \
            postgres:17-alpine \
            psql -At -h 127.0.0.1 -U zneondrive -d zneondrive_test \
              -c "SELECT (NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls)::text FROM pg_roles WHERE rolname='zneondrive_monitor'")
          if [ "$role_privileges_ok" != 'true' ]; then
            echo "unexpected monitoring privilege assertion: $role_privileges_ok"
            exit 1
          fi

          membership=$(docker run --rm --network host \
            -e PGPASSWORD='zneondrive-test' \
            postgres:17-alpine \
            psql -At -h 127.0.0.1 -U zneondrive -d zneondrive_test \
              -c "SELECT pg_has_role('zneondrive_monitor', 'pg_monitor', 'member')")
          if [ "$membership" != 't' ]; then
            echo "monitoring role is not a pg_monitor member: $membership"
            exit 1
          fi

          cid=$(docker run -d --network host \
            -e DATA_SOURCE_URI='127.0.0.1:5432/zneondrive_test?sslmode=disable' \
            -e DATA_SOURCE_USER='zneondrive_monitor' \
            -e DATA_SOURCE_PASS="$monitor_password" \
            -e PG_EXPORTER_COLLECTION_TIMEOUT=5s \
            quay.io/prometheuscommunity/postgres-exporter:v0.19.1)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          metrics_file=$(mktemp)
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9187/metrics >"$metrics_file"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'postgres exporter never became scrape-ready'
            docker logs "$cid" 2>&1 | sed -E 's/(password|pass)=([^ ]+)/\1=[REDACTED]/gi' || true
            exit 1
          fi
          if ! grep -Eq '^pg_up(\{[^}]*\})? 1$' "$metrics_file"; then
            echo 'postgres exporter reported pg_up != 1'
            grep '^pg_up' "$metrics_file" || true
            docker logs "$cid" 2>&1 | sed -E 's/(password|pass)=([^ ]+)/\1=[REDACTED]/gi' || true
            exit 1
          fi
          if ! grep -q '^pg_stat_database_' "$metrics_file"; then
            echo 'postgres exporter did not expose pg_stat_database metrics'
            exit 1
          fi
          if grep -Fq 'zneondrive-test' "$metrics_file" || grep -Fq "$monitor_password" "$metrics_file"; then
            echo 'exporter metrics leaked a database credential'
            exit 1
          fi

      - name: PostgreSQL isolated backup and restore drill
        env:
          DATABASE_ADMIN_URL: postgres://zneondrive:zneondrive-test@127.0.0.1:5432/postgres?sslmode=disable
          POSTGRES_CLIENT_IMAGE: postgres:17-alpine
        run: bash ../../tools/postgres-restore-drill.sh

      - name: Upload restore drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-restore-drill-${{ github.sha }}
          path: .runtime/backup-restore-drill/
          if-no-files-found: error
          retention-days: 30

      - name: Vet
        run: go vet ./...

      - name: Build service
        run: go build -trimpath ./cmd/server