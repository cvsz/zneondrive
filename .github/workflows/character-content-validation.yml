name: Character Content Validation

on:
  pull_request:
    paths:
      - 'design/catalog/**'
      - 'game/Content/Characters/**'
      - 'game/Source/NeonDrive/NDCharacter*'
      - 'tools/validate-character-catalog.py'
      - '.github/workflows/character-content-validation.yml'
  push:
    branches: [main]
    paths:
      - 'design/catalog/**'
      - 'game/Content/Characters/**'
      - 'game/Source/NeonDrive/NDCharacter*'
      - 'tools/validate-character-catalog.py'
      - '.github/workflows/character-content-validation.yml'

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate character catalog
        run: python tools/validate-character-catalog.py
