name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            ABOUT.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            ROADMAP.md
            IMPLEMENTATION-CHECKLIST.md
            zNeonDrive-concept.md
            docs/game-design-bible-v0.1.md
            docs/game-design-bible-v0.2.md
            docs/vertical-slice-v0.2.md
            docs/runtime-prototype-v0.4.md
            docs/architecture.md
            docs/content-contracts.md
            docs/adr/0003-executable-reference-runtime.md
            docs/adr/0004-unreal-engine-client-and-gameplay-server.md
            docs/adr/0005-durable-service-plane.md
            docs/adr/0006-phase-gated-deployment.md
            design/catalog/characters.json
            design/catalog/factions.json
            design/catalog/districts.json
            design/catalog/quests-main.json
            design/catalog/vertical-slice.json
            design/catalog/vehicle-parts.json
            design/schemas/quest.schema.json
            design/schemas/vehicle.schema.json
            design/schemas/vertical-slice.schema.json
            src/zneondrive/domain.py
            tests/test_reference_runtime.py
            tools/validate_design.py
            tools/validate_client_demo.py
            tools/validate_runtime_v0_4.py
            demo/index.html
            demo/styles.css
            demo/app.js
            client/README.md
            client/EXECUTIVE-BRIEF-TH.md
            client/PRESENTATION-TALK-TRACK-TH.md
            client/DEMO-RUNBOOK-TH.md
            client/COMMERCIAL-SCOPE-TH.md
            client/CLIENT-QA-TH.md
            game/NeonDrive.uproject
            game/Source/NeonDrive/NDVehiclePawn.cpp
            game/Source/NeonDriveServer.Target.cs
            services/game-api/go.mod
            services/game-api/cmd/server/main.go
            services/game-api/internal/store/postgres.go
            services/game-api/internal/store/migrations/001_init.sql
            compose.yaml
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Check for common secret file names
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'

      - name: Validate JSON syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path("design").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"ok {path}")
          json.loads(Path("game/NeonDrive.uproject").read_text(encoding="utf-8"))
          print("ok game/NeonDrive.uproject")
          PY

      - name: Validate design invariants
        run: python3 tools/validate_design.py

      - name: Validate client presentation package
        run: python3 tools/validate_client_demo.py

      - name: Validate runtime prototype structure
        run: python3 tools/validate_runtime_v0_4.py

      - name: Run executable reference contract tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Compile reference package
        run: python3 -m compileall -q src
