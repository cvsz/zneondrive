services:
  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.max=500
      - -c
      - pg_stat_statements.track=top
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zneondrive}
      POSTGRES_USER: ${POSTGRES_USER:-zneondrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zneondrive-local}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-zneondrive-monitor-local}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - zneondrive-postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init-monitoring.sh:/docker-entrypoint-initdb.d/20-monitoring.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zneondrive} -d ${POSTGRES_DB:-zneondrive}"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    command:
      - --collector.stat_statements
      - --collector.stat_statements.limit=25
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-zneondrive}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-zneondrive_monitor}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-zneondrive-monitor-local}
      PG_EXPORTER_COLLECTION_TIMEOUT: 5s
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-19187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - zneondrive-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  game-api:
    build:
      context: ./services/game-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zneondrive}:${POSTGRES_PASSWORD:-zneondrive-local}@postgres:5432/${POSTGRES_DB:-zneondrive}?sslmode=disable
      REDIS_ADDR: redis:6379
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LISTEN_ADDR: :8080
      METRICS_LISTEN_ADDR: :9090
      GAME_SERVER_SHARED_KEY: ${GAME_SERVER_SHARED_KEY:?GAME_SERVER_SHARED_KEY must be set}
    ports:
      - "${GAME_API_PORT:-18080}:8080"
      - "127.0.0.1:${GAME_API_METRICS_PORT:-19090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-18085}:8080"
    depends_on:
      game-api:
        condition: service_started
    restart: unless-stopped

volumes:
  zneondrive-postgres:
  zneondrive-redis:
