server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  # Deliberately expose only the API health probe through the public website.
  # Player/session/quest/build/race mutations remain on the service-plane boundary.
  location = /api/healthz {
    proxy_pass http://game-api:8080/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }

  # Fail closed for every other public /api path.
  location ^~ /api/ {
    default_type text/plain;
    return 404 'not found\n';
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location = /robots.txt { try_files $uri =404; }
  location = /sitemap.xml { try_files $uri =404; }
  location = /privacy.html { try_files $uri =404; }
  location = /terms.html { try_files $uri =404; }

  # Release directories must never fall back to the SPA index. Missing or
  # unpublished client artifacts must return a real 404 response.
  location ^~ /client-v-0-0-1/ {
    try_files $uri $uri/ =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
